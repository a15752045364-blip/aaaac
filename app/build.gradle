plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.opendevoptions'
    compileSdk 33

    defaultConfig {
        applicationId "com.example.opendevoptions"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
}
